<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis Server</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Libreria Chart.js -->
</head>
<body>
<header>
    <h1>Benvenuto!</h1>
</header>
<main>
    <h2>Esplora i dati:</h2>
    <div class="endpoint-links">
        <button onclick="loadData('query?filename=resultCounts.csv')">Vittorie  per colore</button>
        <button onclick="loadData('query?filename=popularOpenings.csv')">Aperture più popolari</button>
        <button onclick="loadData('query?filename=avgRatingDiff.csv')">Differenze medie di rating</button>
        <button onclick="loadStatistics()">Visualizza Statistiche Generali</button>
        <button onclick="loadMVPStatistics()">Visualizza Statistiche MVP</button> <!-- Pulsante per MVP -->
    </div>

    <!-- Loader con animazione -->
    <div id="loader" class="hidden">Caricamento...</div>

    <!-- Contenitore per i risultati della tabella -->
    <div id="resultContainer"></div>

    <!-- Sezione per i grafici con titoli -->
    <div class="chart-section hidden" id="chartSection1">
        <h3>Valori Assoluti</h3>
        <div id="chartContainer1" class="chart-container">
            <canvas id="chart1" width="400" height="200"></canvas>
        </div>
    </div>

    <div class="chart-section hidden" id="chartSection2">
        <h3>Percentuali</h3>
        <div id="chartContainer2" class="chart-container">
            <canvas id="chart2" width="400" height="200"></canvas>
        </div>
    </div>

    <!-- Contenitore per le statistiche MVP -->
    <div id="mvpContainer" class="hidden">
        <h2>Statistiche MVP</h2>

        <!-- Giocatori più vincenti (assoluto) -->
        <div id="mvpTopPlayersAbsolute" class="mvp-section">
            <h3>Giocatori più vincenti (assoluto)</h3>
        </div>

        <!-- Giocatori con maggior percentuale di vittorie -->
        <div id="mvpTopPlayersPercentage" class="mvp-section">
            <h3>Giocatori con maggior percentuale di vittorie</h3>
        </div>

        <!-- Aperture più vincenti -->
        <div id="mvpTopWinningOpenings" class="mvp-section">
            <h3>Aperture più vincenti</h3>
        </div>

        <!-- Tornei più giocati -->
        <div id="mvpTopTournaments" class="mvp-section">
            <h3>Tornei più giocati</h3>
        </div>
    </div>
</main>
<footer>
    Chess Analysis Server © 2025
</footer>
<script src="js/script.js"></script>
</body>
</html>
