<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis Server</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Benvenuto nel server di analisi scacchi!</h1>
</header>
<main>
    <h2>Esplora i dati:</h2>
    <div class="endpoint-links">
        <button onclick="loadData('/resultCounts')">Vittorie per colore</button>
        <button onclick="loadData('/popularOpenings')">Aperture più popolari</button>
        <button onclick="loadData('/avgRatingDiff')">Differenze medie di rating</button>
    </div>
    <div id="loader" class="hidden"></div>
    <div id="resultContainer">I risultati saranno visualizzati qui...</div>
</main>
<footer>
    Chess Analysis Server © 2025
</footer>
<script src="js/script.js"></script>
</body>
</html>
